<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murrel Fish Videos</title>
    <meta name="description" content="Watch, explore, and learn about Murrel fish farming, feeding techniques, breeding, hatchery management, and culinary delights." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body { background-color: #f0f8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .aspect-video { aspect-ratio: 16 / 9; }
    </style>
  </head>
  <body class="bg-[#f0f8f0] text-slate-900 antialiased selection:bg-emerald-200">
    <div id="root"></div>

    <script>
      (function() {
        const STORAGE_KEY_CUSTOM = 'murrel_custom_videos_v1';
        const STORAGE_KEY_SAVED = 'murrel_saved_videos_v1';

        const INITIAL_VIDEOS = [
          {
            id: 's3YFytpSuFQ',
            title: 'Our Murrel Fish Videos - Farming & Seed Tank Tour',
            description: 'An exclusive inside look at our Murrel (Snakehead / Korrameenu / Channa striata) fish farm, showing seed rearing tanks, active swimming fingerlings, aeration setup, and pond water conditioning.',
            category: 'farming',
            author: 'Murrel Fish Farm',
            duration: '4:15',
            views: '12.4K',
            tags: ['Our Farm', 'Murrel Seed', 'Water Conditioning', 'Tank Culture'],
            keyTakeaways: [
              'Maintain clean, oxygenated nursery water for high fingerling survival',
              'Air-breathing labyrinth organ allows Murrel to thrive in low DO conditions',
              'Grading every 10-15 days is critical to prevent cannibalism among unequal fingerling sizes',
              'Acclimatize fingerlings gradually to avoid thermal shock'
            ]
          },
          {
            id: 'g-D1uP7uKqM',
            title: 'High-Density Murrel Fish Culture in Cement Tanks & Biofloc',
            description: 'Complete breakdown of raising Murrel in intensive circular cement tanks and biofloc systems, managing organic waste and maximizing square meter stocking density.',
            category: 'farming',
            author: 'AquaFarming Masterclass',
            duration: '8:42',
            views: '45.1K',
            tags: ['Cement Tanks', 'Biofloc', 'High Density', 'Water Management'],
            keyTakeaways: [
              'Stocking density of 30-50 fish per cubic meter is achievable with proper solids removal',
              'Continuous aeration and weekly sludge evacuation keeps ammonia below 0.05 mg/L',
              'Tank covers or net barriers are mandatory as Murrel can jump out during night hours'
            ]
          },
          {
            id: 'o_X4QG8T_lE',
            title: 'Murrel Fingerlings Feed Training: Live Feed to Floating Pellets',
            description: 'Step-by-step method to transition predatory Murrel larvae from Artemia/tubifex worms to slow-sinking and commercial high-protein floating pellets (40-45% crude protein).',
            category: 'feeding',
            author: 'Fisheries Tech Channel',
            duration: '11:20',
            views: '32.8K',
            tags: ['Feed Training', 'Artemia', 'Floating Pellets', 'Cannibalism Control'],
            keyTakeaways: [
              'Murrel naturally hunt live prey; training onto formulated pellet feed requires consistent timing',
              'Mix minced trash fish paste with micro-pellets for 4 days before switching completely',
              'Feed 2-3 times daily at fixed spots to trigger surface schooling behavior'
            ]
          },
          {
            id: 'T5yC5g2E_L8',
            title: 'Induced Breeding & Seed Production of Channa striata (Murrel)',
            description: 'Hatchery protocol for Murrel breeding using pituitary extract and synthetic GnRH (Ovaprim / Ovatide), natural pairing, floating egg incubation, and hatching troughs.',
            category: 'breeding',
            author: 'ICAR Aquaculture Research',
            duration: '14:35',
            views: '88.3K',
            tags: ['Induced Breeding', 'Hatchery', 'Ovaprim', 'Egg Incubation'],
            keyTakeaways: [
              'Select mature healthy broodstock (1.0 - 1.5 kg) with prominent genital papilla',
              'Inject females with 0.4-0.6 ml/kg Ovaprim; males receive half dose',
              'Spawning occurs within 16-24 hours at 28-30°C in weed-covered breeding tanks',
              'Eggs are yellowish, floating, non-adhesive, hatching in 24-30 hours'
            ]
          },
          {
            id: 'M6Q7qL0yPms',
            title: 'Commercial Murrel Harvesting, Live Transportation & Market Economics',
            description: 'Best techniques for netting, live oxygenated hauling, and marketing Murrel at local markets where live fish command premium prices up to 2-3x carp species.',
            category: 'harvest',
            author: 'Agri Business India',
            duration: '7:50',
            views: '61.7K',
            tags: ['Harvesting', 'Live Transport', 'Market Price', 'Economics'],
            keyTakeaways: [
              'Murrel stay alive in moist conditions for hours, significantly reducing cold storage costs',
              'Average weight at 7-8 months reaches 700g to 1.1kg under commercial feeding',
              'Direct live sale to consumers or restaurants captures the highest profit margins'
            ]
          },
          {
            id: 'K5yU9w2D_qA',
            title: 'Traditional Spicy Murrel Fish Curry (Korrameenu Pulusu / Viral Meen)',
            description: 'Authentic village-style preparation of tender Murrel fish, rich in natural omega-3 and albumin, with clay pot simmering and aromatic spices.',
            category: 'cooking',
            author: 'Village Food Secrets',
            duration: '10:15',
            views: '110K',
            tags: ['Traditional Recipe', 'Clay Pot', 'Medicinal Food', 'High Protein'],
            keyTakeaways: [
              'Murrel meat is firm, single-boned, and sweet with low intramuscular pin bones',
              'Renowned in traditional medicine for speeding post-surgery healing and wound repair',
              'Clay pot slow cooking locks in natural juices and gelatinous skin nutrients'
            ]
          }
        ];

        let customVideos = [];
        try {
          const stored = localStorage.getItem(STORAGE_KEY_CUSTOM);
          if (stored) customVideos = JSON.parse(stored);
        } catch(e) {}

        let savedIds = [];
        try {
          const stored = localStorage.getItem(STORAGE_KEY_SAVED);
          if (stored) savedIds = JSON.parse(stored);
        } catch(e) {}

        let activeVideo = INITIAL_VIDEOS[0];
        let searchQuery = '';
        let activeCategory = 'all';
        let showOnlySaved = false;
        let isCinemaMode = false;

        function getAllVideos() { return [...customVideos, ...INITIAL_VIDEOS]; }

        function extractYouTubeId(urlOrId) {
          if (!urlOrId) return null;
          const trimmed = urlOrId.trim();
          if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
          const match = trimmed.match(/(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
          return match ? match[1] : null;
        }

        function renderApp() {
          const root = document.getElementById('root');
          if (!root) return;

          const allVideos = getAllVideos();
          const filteredVideos = allVideos.filter(v => {
            if (activeCategory !== 'all' && v.category !== activeCategory) return false;
            if (showOnlySaved && !savedIds.includes(v.id)) return false;
            if (searchQuery.trim()) {
              const q = searchQuery.toLowerCase();
              return v.title.toLowerCase().includes(q) ||
                     v.description.toLowerCase().includes(q) ||
                     v.author.toLowerCase().includes(q) ||
                     v.tags.some(t => t.toLowerCase().includes(q));
            }
            return true;
          });

          const isSaved = savedIds.includes(activeVideo.id);

          root.innerHTML = `
            <div class="min-h-screen bg-[#f0f8f0] text-slate-900 flex flex-col">
              
              <!-- Top Navbar -->
              <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-emerald-100 shadow-xs">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div class="flex items-center justify-between h-18 gap-3 sm:gap-4">
                    
                    <div class="flex items-center gap-3 shrink-0 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-700 flex items-center justify-center text-white shadow-md shadow-emerald-700/20">
                        <i data-lucide="fish" class="w-6 h-6"></i>
                      </div>
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-xl tracking-tight text-slate-900">Murrel Fish</span>
                          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 uppercase tracking-wider">Videos Hub</span>
                        </div>
                        <p class="text-xs text-slate-500 hidden sm:block">Korrameenu &bull; Snakehead &bull; Aquaculture &bull; Recipes</p>
                      </div>
                    </div>

                    <div class="flex-1 max-w-md hidden md:block">
                      <div class="relative">
                        <i data-lucide="search" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                        <input
                          id="search-input"
                          type="text"
                          placeholder="Search videos (fingerlings, biofloc, feeding, breeding)..."
                          value="${searchQuery}"
                          class="w-full pl-10 pr-4 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/30 text-slate-800"
                        />
                      </div>
                    </div>

                    <div class="flex items-center gap-1.5 sm:gap-2">
                      <button id="btn-open-calc" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-700 hover:text-emerald-700 hover:bg-emerald-50 border border-slate-200 cursor-pointer">
                        <i data-lucide="calculator" class="w-4 h-4 text-emerald-600"></i>
                        <span class="hidden sm:inline">Farm Calculator</span>
                      </button>

                      <button id="btn-open-guide" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-700 hover:text-emerald-700 hover:bg-emerald-50 border border-slate-200 cursor-pointer">
                        <i data-lucide="book-open" class="w-4 h-4 text-emerald-600"></i>
                        <span class="hidden sm:inline">Care Guide</span>
                      </button>

                      <button id="btn-toggle-saved" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium border cursor-pointer ${showOnlySaved ? 'bg-amber-500 text-white border-amber-500' : 'text-slate-700 border-slate-200 hover:bg-amber-50'}">
                        <i data-lucide="bookmark" class="w-4 h-4 ${showOnlySaved ? 'fill-white' : 'text-amber-500'}"></i>
                        <span class="hidden sm:inline">Saved</span>
                        ${savedIds.length > 0 ? `<span class="text-xs px-1.5 py-0.2 rounded-full font-bold ${showOnlySaved ? 'bg-amber-600 text-white' : 'bg-amber-100 text-amber-800'}">${savedIds.length}</span>` : ''}
                      </button>

                      <button id="btn-open-add" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-700/25 cursor-pointer">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        <span>Add Video</span>
                      </button>
                    </div>

                  </div>

                  <div class="pb-3 md:hidden">
                    <input
                      id="search-input-mobile"
                      type="text"
                      placeholder="Search Murrel videos..."
                      value="${searchQuery}"
                      class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/30 text-slate-800"
                    />
                  </div>
                </div>
              </header>

              <!-- Main Showcase -->
              <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 space-y-8">
                
                <section class="${isCinemaMode ? 'max-w-full' : 'max-w-5xl'} mx-auto transition-all">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 gap-2">
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-600 text-white shadow-xs">Featured Video</span>
                        <span class="text-xs font-medium text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full capitalize">${activeVideo.category}</span>
                        ${activeVideo.id === 's3YFytpSuFQ' ? `<span class="text-xs font-semibold text-teal-700 bg-teal-50 border border-teal-200 px-2 py-0.5 rounded-full flex items-center gap-1"><i data-lucide="sparkles" class="w-3 h-3 text-teal-600"></i> Farm Official</span>` : ''}
                      </div>
                      <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-950 tracking-tight">${activeVideo.title}</h1>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                      <button id="btn-toggle-cinema" class="p-2 rounded-lg text-slate-600 hover:text-emerald-700 hover:bg-emerald-50 border border-slate-200 cursor-pointer" title="Cinema mode">
                        <i data-lucide="${isCinemaMode ? 'minimize-2' : 'maximize-2'}" class="w-4 h-4"></i>
                      </button>

                      <button id="btn-save-active" class="p-2 rounded-lg border cursor-pointer ${isSaved ? 'bg-amber-500 text-white border-amber-500' : 'text-slate-600 hover:bg-amber-50 border-slate-200'}" title="Bookmark video">
                        <i data-lucide="bookmark" class="w-4 h-4 ${isSaved ? 'fill-white' : ''}"></i>
                      </button>

                      <a href="https://www.youtube.com/watch?v=${activeVideo.id}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2.5 py-2 rounded-lg text-xs font-semibold text-red-700 hover:text-white bg-red-50 hover:bg-red-600 border border-red-200 transition-colors">
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">YouTube</span>
                      </a>
                    </div>
                  </div>

                  <!-- 16:9 Frame -->
                  <div class="relative w-full rounded-2xl overflow-hidden bg-slate-950 shadow-2xl ring-1 ring-slate-900/10 aspect-video">
                    <iframe
                      src="https://www.youtube-nocookie.com/embed/${activeVideo.id}?rel=0"
                      title="${activeVideo.title}"
                      class="w-full h-full border-0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                      allowfullscreen>
                    </iframe>
                  </div>

                  <div class="mt-4 p-4 sm:p-5 bg-white rounded-2xl border border-emerald-100 shadow-xs">
                    <div class="flex items-center justify-between pb-3 border-b border-slate-100 text-xs text-slate-500">
                      <span class="font-semibold text-slate-800 text-sm">${activeVideo.author}</span>
                      <div class="flex items-center gap-3">
                        ${activeVideo.duration ? `<span class="flex items-center gap-1"><i data-lucide="clock" class="w-3.5 h-3.5"></i> ${activeVideo.duration}</span>` : ''}
                        ${activeVideo.views ? `<span class="flex items-center gap-1"><i data-lucide="eye" class="w-3.5 h-3.5"></i> ${activeVideo.views} views</span>` : ''}
                      </div>
                    </div>

                    <p class="mt-3 text-sm text-slate-600 leading-relaxed">${activeVideo.description}</p>

                    ${activeVideo.keyTakeaways && activeVideo.keyTakeaways.length > 0 ? `
                      <div class="mt-4 p-3.5 bg-emerald-50/70 border border-emerald-200/60 rounded-xl">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-900 uppercase tracking-wider mb-2">
                          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-600"></i>
                          Key Aquaculture Insights & Tips:
                        </div>
                        <ul class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-emerald-950">
                          ${activeVideo.keyTakeaways.map(p => `<li class="flex items-start gap-2"><span class="w-1.5 h-1.5 rounded-full bg-emerald-600 mt-1.5 shrink-0"></span><span>${p}</span></li>`).join('')}
                        </ul>
                      </div>
                    ` : ''}
                  </div>
                </section>

                <!-- Quick Biological Highlights -->
                ${!isCinemaMode ? `
                  <section class="bg-white/80 backdrop-blur-xs rounded-3xl p-5 border border-emerald-100 shadow-xs">
                    <div class="flex items-center justify-between mb-4">
                      <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <h2 class="text-sm font-bold uppercase tracking-wider text-emerald-900">Murrel (Snakehead / Korrameenu) Species Quick Facts</h2>
                      </div>
                      <button id="btn-quick-guide" class="text-xs font-semibold text-emerald-700 hover:text-emerald-800 hover:underline flex items-center gap-1 cursor-pointer">
                        <span>Full Aquaculture Guide</span> &rarr;
                      </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
                      <div class="p-3.5 rounded-2xl bg-slate-50/70 border border-slate-100">
                        <div class="flex items-center gap-2 mb-1.5"><i data-lucide="wind" class="w-5 h-5 text-emerald-600"></i><h3 class="font-bold text-xs text-slate-800">Air-Breathing Organ</h3></div>
                        <p class="text-[12px] text-slate-600">Murrels have a suprabranchial organ allowing them to breathe atmospheric air directly.</p>
                      </div>
                      <div class="p-3.5 rounded-2xl bg-slate-50/70 border border-slate-100">
                        <div class="flex items-center gap-2 mb-1.5"><i data-lucide="heart-pulse" class="w-5 h-5 text-rose-500"></i><h3 class="font-bold text-xs text-slate-800">Medicinal Healing</h3></div>
                        <p class="text-[12px] text-slate-600">Rich in arachidonic acid and albumin, accelerates wound and surgical recovery.</p>
                      </div>
                      <div class="p-3.5 rounded-2xl bg-slate-50/70 border border-slate-100">
                        <div class="flex items-center gap-2 mb-1.5"><i data-lucide="trending-up" class="w-5 h-5 text-amber-500"></i><h3 class="font-bold text-xs text-slate-800">Premium Live Value</h3></div>
                        <p class="text-[12px] text-slate-600">Live fish fetch ₹400 - ₹800/kg (2-3x higher price than traditional carps).</p>
                      </div>
                      <div class="p-3.5 rounded-2xl bg-slate-50/70 border border-slate-100">
                        <div class="flex items-center gap-2 mb-1.5"><i data-lucide="shield-check" class="w-5 h-5 text-teal-600"></i><h3 class="font-bold text-xs text-slate-800">High Protein Ratio</h3></div>
                        <p class="text-[12px] text-slate-600">Lean muscle meat delivers over 20-22% high-digestibility protein with minimal intramuscular fat.</p>
                      </div>
                    </div>
                  </section>
                ` : ''}

                <!-- Video Cards Grid -->
                <section class="space-y-5">
                  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2">
                    <div>
                      <h2 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                        <span>Explore Murrel Videos</span>
                        <span class="text-xs font-semibold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">${filteredVideos.length} Videos</span>
                      </h2>
                      <p class="text-xs text-slate-500 mt-0.5">Click any card to play in the cinema player above</p>
                    </div>

                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                      ${[
                        { id: 'all', label: 'All' },
                        { id: 'farming', label: 'Farming & Tanks' },
                        { id: 'feeding', label: 'Feeding' },
                        { id: 'breeding', label: 'Breeding' },
                        { id: 'harvest', label: 'Harvest' },
                        { id: 'cooking', label: 'Cooking' },
                      ].map(cat => `
                        <button
                          onclick="window.__setCategory('${cat.id}')"
                          class="px-3 py-1.5 rounded-xl text-xs font-semibold cursor-pointer whitespace-nowrap transition-all ${activeCategory === cat.id ? 'bg-emerald-600 text-white shadow-xs' : 'bg-white text-slate-600 hover:bg-emerald-50 border border-slate-200'}"
                        >
                          ${cat.label}
                        </button>
                      `).join('')}
                    </div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    ${filteredVideos.map(vid => {
                      const isVidActive = vid.id === activeVideo.id;
                      const isVidSaved = savedIds.includes(vid.id);
                      return `
                        <div
                          onclick="window.__selectVideo('${vid.id}')"
                          class="group relative flex flex-col bg-white rounded-2xl overflow-hidden border transition-all cursor-pointer ${isVidActive ? 'ring-2 ring-emerald-500 border-emerald-500 shadow-md scale-[1.01]' : 'border-slate-200/80 hover:border-emerald-300 hover:shadow-lg hover:-translate-y-0.5'}"
                        >
                          <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                            <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" alt="${vid.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" />
                            <div class="absolute inset-0 bg-slate-950/30 group-hover:bg-slate-950/40 transition-colors flex items-center justify-center">
                              <div class="w-12 h-12 rounded-full flex items-center justify-center ${isVidActive ? 'bg-emerald-500 text-white shadow-lg scale-110' : 'bg-white/90 text-emerald-900 shadow-md'}">
                                <i data-lucide="play" class="w-5 h-5 ml-0.5 fill-current"></i>
                              </div>
                            </div>
                            <div class="absolute top-2.5 left-2.5">
                              <span class="text-[11px] font-semibold uppercase px-2 py-0.5 rounded-md bg-white/90 text-emerald-800 shadow-xs">${vid.category}</span>
                            </div>
                            ${vid.duration ? `<div class="absolute bottom-2.5 right-2.5"><span class="text-[11px] font-medium bg-slate-900/85 text-white px-2 py-0.5 rounded-md flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${vid.duration}</span></div>` : ''}
                          </div>

                          <div class="p-4 flex-1 flex flex-col justify-between">
                            <div>
                              <div class="flex items-start justify-between gap-2">
                                <h3 class="font-semibold text-sm text-slate-900 line-clamp-2 group-hover:text-emerald-700">${vid.title}</h3>
                                <button onclick="event.stopPropagation(); window.__toggleSave('${vid.id}')" class="p-1 text-slate-400 hover:text-amber-500 shrink-0">
                                  <i data-lucide="bookmark" class="w-4 h-4 ${isVidSaved ? 'fill-amber-500 text-amber-500' : ''}"></i>
                                </button>
                              </div>
                              <p class="mt-1.5 text-xs text-slate-500 line-clamp-2">${vid.description}</p>
                            </div>
                            <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                              <span class="font-medium text-slate-700 truncate max-w-[130px]">${vid.author}</span>
                              ${vid.views ? `<span class="flex items-center gap-1 text-[11px]"><i data-lucide="eye" class="w-3 h-3 text-slate-400"></i> ${vid.views}</span>` : ''}
                            </div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </section>

              </main>

              <!-- Footer -->
              <footer class="mt-16 bg-white border-t border-emerald-100/80 py-8">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                  <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                      <div class="w-8 h-8 rounded-lg bg-emerald-600 text-white flex items-center justify-center">
                        <i data-lucide="fish" class="w-5 h-5"></i>
                      </div>
                      <div>
                        <p class="font-bold text-sm text-slate-800">Murrel Fish Videos</p>
                        <p class="text-xs text-slate-500">Dedicated knowledge base for Snakehead / Korrameenu / Viral fish farming</p>
                      </div>

          if (window.lucide) window.lucide.createIcons();

          document.getElementById('btn-open-calc')?.addEventListener('click', () => window.__openModal('calc'));

            showOnlySaved = !showOnlySaved;
            renderApp();
          });

          const sInput = document.getElementById('search-input');
          if (sInput) {
            sInput.addEventListener('input', (e) => {
              searchQuery = e.target.value;
              renderApp();
            });
          }
          const sInputM = document.getElementById('search-input-mobile');

            sInputM.addEventListener('input', (e) => {
              searchQuery = e.target.value;
              renderApp();
            });

            renderApp();
          });
          document.getElementById('btn-save-active')?.addEventListener('click', () => {
            window.__toggleSave(activeVideo.id);
          });
        }

        window.__selectVideo = function(id) {
          const target = getAllVideos().find(v => v.id === id);
          if (target) {
            activeVideo = target;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        };

        window.__setCategory = function(cat) {
          activeCategory = cat;
          renderApp();
        };

        window.__toggleSave = function(id) {
          if (savedIds.includes(id)) {
            savedIds = savedIds.filter(x => x !== id);
          } else {
            savedIds.push(id);
          }
          try { localStorage.setItem(STORAGE_KEY_SAVED, JSON.stringify(savedIds)); } catch(e) {}
          renderApp();
        };

        window.__openModal = function(type) {
          const container = document.getElementById('modal-container');
          if (!container) return;

          if (type === 'calc') {
            container.innerHTML = `
              <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">

                      <div>

                      </div>
                    </div>
                    <button onclick="window.__closeModal()" class="p-1.5 rounded-full text-slate-400 hover:text-slate-700 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>

                  <div class="p-6 max-h-[70vh] overflow-y-auto space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Fingerlings Stocked</label>
                        <input type="number" id="mcalc-seeds" value="1000" min="50" step="50" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Target Weight (kg/fish)</label>
                        <input type="number" id="mcalc-weight" value="0.85" min="0.3" step="0.05" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Survival Rate (%)</label>
                        <input type="number" id="mcalc-surv" value="82" min="30" max="100" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">FCR (Feed Conversion)</label>

                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Feed Cost / kg (₹)</label>
                        <input type="number" id="mcalc-feedcost" value="95" min="1" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Selling Price / kg (₹)</label>
                        <input type="number" id="mcalc-price" value="500" min="1" class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl font-bold" />
                      </div>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100">
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                          <span class="text-[11px] text-slate-500 block">Surviving Fish</span>
                          <span id="mres-surv" class="text-base font-bold text-slate-800">820</span>
                        </div>
                        <div class="p-3 bg-emerald-50 rounded-2xl border border-emerald-100">
                          <span class="text-[11px] text-emerald-800 block">Biomass Yield</span>
                          <span id="mres-biomass" class="text-base font-bold text-emerald-900">697 kg</span>
                        </div>
                        <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                          <span class="text-[11px] text-slate-500 block">Feed Required</span>
                          <span id="mres-feed" class="text-base font-bold text-slate-800">976 kg</span>
                        </div>
                        <div class="p-3 bg-amber-50 rounded-2xl border border-amber-100">
                          <span class="text-[11px] text-amber-800 block">Total Feed Cost</span>
                          <span id="mres-feedexpense" class="text-base font-bold text-amber-900">₹92,720</span>
                        </div>
                      </div>

                      <div class="mt-4 p-4 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white shadow-lg">
                        <div class="flex items-center justify-between">
                          <div>
                            <div class="text-xs text-emerald-100 uppercase">Gross Revenue</div>
                            <div id="mres-revenue" class="text-xl font-bold">₹3,48,500</div>
                          </div>
                          <div class="text-right">
                            <div class="text-xs text-emerald-100 uppercase">Est. Net Profit</div>
                            <div id="mres-profit" class="text-2xl font-black">₹2,35,780</div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `;

            function recalculate() {
              const s = Number(document.getElementById('mcalc-seeds').value) || 0;
              const w = Number(document.getElementById('mcalc-weight').value) || 0;
              const surv = Number(document.getElementById('mcalc-surv').value) || 0;
              const fcr = Number(document.getElementById('mcalc-fcr').value) || 0;
              const fc = Number(document.getElementById('mcalc-feedcost').value) || 0;
              const p = Number(document.getElementById('mcalc-price').value) || 0;

              const surviving = Math.round(s * (surv / 100));
              const biomass = Math.round(surviving * w);
              const totalFeed = Math.round(biomass * fcr);
              const feedExpense = Math.round(totalFeed * fc);
              const seedExpense = Math.round(s * 20);
              const totalCost = feedExpense + seedExpense;
              const rev = Math.round(biomass * p);
              const profit = rev - totalCost;

              document.getElementById('mres-surv').innerText = surviving.toLocaleString();
              document.getElementById('mres-biomass').innerText = biomass.toLocaleString() + ' kg';
              document.getElementById('mres-feed').innerText = totalFeed.toLocaleString() + ' kg';
              document.getElementById('mres-feedexpense').innerText = '₹' + feedExpense.toLocaleString();
              document.getElementById('mres-revenue').innerText = '₹' + rev.toLocaleString();
              document.getElementById('mres-profit').innerText = '₹' + profit.toLocaleString();
            }

            ['mcalc-seeds','mcalc-weight','mcalc-surv','mcalc-fcr','mcalc-feedcost','mcalc-price'].forEach(id => {
              document.getElementById(id)?.addEventListener('input', recalculate);
            });
          } else if (type === 'guide') {
            container.innerHTML = `
              <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
                <div class="relative w-full max-w-3xl bg-white rounded-3xl shadow-2xl border border-emerald-100 overflow-hidden" onclick="event.stopPropagation()">
                  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-emerald-50 to-teal-50">
                    <div class="flex items-center gap-2.5">
                      <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center"><i data-lucide="book-open" class="w-4 h-4"></i></div>
                      <div>
                        <h2 class="text-lg font-bold text-slate-900">Murrel Fish Care & Aquaculture Guide</h2>
                        <p class="text-xs text-slate-500">Biological Parameters & Best Farming Practices</p>
                      </div>
                    </div>
                    <button onclick="window.__closeModal()" class="p-1.5 rounded-full text-slate-400 hover:text-slate-700 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>

                  <div class="p-6 max-h-[75vh] overflow-y-auto space-y-5 text-sm text-slate-700">
                    <div>
                      <h3 class="text-xs font-bold uppercase tracking-wider text-emerald-800 mb-3">Optimal Water Parameters</h3>
                      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div class="p-3 bg-emerald-50/60 border border-emerald-100 rounded-xl">
                          <span class="text-xs text-slate-500 block">Water Temp</span>
                          <span class="text-base font-bold text-emerald-950">26°C – 32°C</span>
                          <span class="text-[11px] text-emerald-700 block mt-0.5">Below 20°C slows growth</span>
                        </div>
                        <div class="p-3 bg-emerald-50/60 border border-emerald-100 rounded-xl">
                          <span class="text-xs text-slate-500 block">pH Range</span>
                          <span class="text-base font-bold text-emerald-950">6.8 – 8.2</span>
                          <span class="text-[11px] text-emerald-700 block mt-0.5">Neutral to alkaline</span>
                        </div>
                        <div class="p-3 bg-emerald-50/60 border border-emerald-100 rounded-xl">
                          <span class="text-xs text-slate-500 block">Dissolved Oxygen</span>
                          <span class="text-base font-bold text-emerald-950">&gt; 3.0 mg/L</span>
                          <span class="text-[11px] text-emerald-700 block mt-0.5">Air-breathing organ</span>
                        </div>
                        <div class="p-3 bg-emerald-50/60 border border-emerald-100 rounded-xl">
                          <span class="text-xs text-slate-500 block">Ammonia (TAN)</span>
                          <span class="text-base font-bold text-emerald-950">&lt; 0.05 mg/L</span>
                          <span class="text-[11px] text-emerald-700 block mt-0.5">Siphon bottom waste</span>
                        </div>
                      </div>
                    </div>

                    <div class="space-y-3">
                      <div class="p-3.5 bg-amber-50/70 border border-amber-200/80 rounded-xl">
                        <h4 class="font-bold text-amber-950 text-xs uppercase">1. Grading Every 10–14 Days Is Mandatory</h4>
                        <p class="text-xs text-amber-900 mt-1">Murrels are aggressive cannibalistic predators. If sizes differ by 20%, larger fingerlings will swallow smaller ones. Regular grading prevents 40% mortality.</p>
                      </div>
                      <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <h4 class="font-bold text-slate-900 text-xs uppercase">2. Anti-Jump Netting (Crucial)</h4>
                        <p class="text-xs text-slate-600 mt-1">Murrels can jump 3 feet into adjacent ponds or dry land, especially during rainy nights. Install perimeter nets or top mesh.</p>
                      </div>
                      <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl">
                        <h4 class="font-bold text-slate-900 text-xs uppercase">3. Feed Weaning to High Protein Pellets</h4>
                        <p class="text-xs text-slate-600 mt-1">Wean fingerlings from Artemia/Moina to 40-45% crude protein slow-sinking pellets using minced fish paste as an attractant.</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          } else if (type === 'add') {
            container.innerHTML = `
              <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-xs">
                <div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl border border-emerald-100 overflow-hidden" onclick="event.stopPropagation()">
                  <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-gradient-to-r from-emerald-50 to-teal-50">
                    <div class="flex items-center gap-2.5">
                      <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center"><i data-lucide="plus" class="w-4 h-4"></i></div>
                      <h2 class="text-lg font-bold text-slate-900">Add Murrel Video</h2>
                    </div>
                    <button onclick="window.__closeModal()" class="p-1.5 rounded-full text-slate-400 hover:text-slate-700 cursor-pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>

                  <form id="add-video-form" class="p-6 space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">YouTube URL or Video ID *</label>
                      <input id="add-url" required type="text" placeholder="e.g. https://youtu.be/s3YFytpSuFQ" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Video Title *</label>
                      <input id="add-title" required type="text" placeholder="e.g. Murrel Feeding in Nursery Tanks" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />

                          <option value="breeding">Breeding</option>

                        <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Channel / Author</label>

                      </div>

                    <div class="pt-2 flex justify-end gap-3">
                      <button type="button" onclick="window.__closeModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>

                    </div>
                  </form>
                </div>
              </div>
            `;

            document.getElementById('add-video-form')?.addEventListener('submit', (e) => {
              e.preventDefault();
              const url = document.getElementById('add-url').value;
              const vidId = extractYouTubeId(url);
              if (!vidId) {
                alert('Please enter a valid YouTube URL or 11-char ID!');
                return;
              }
              const newVid = {
                id: vidId,
                title: document.getElementById('add-title').value.trim() || 'Murrel Video',
                description: 'Custom video added to our Murrel channel.',
                category: document.getElementById('add-cat').value,
                author: document.getElementById('add-author').value.trim() || 'Community Contributor',
                duration: 'Custom',
                views: '1',
                tags: ['Murrel Farm'],
                keyTakeaways: ['Added to farm collection']
              };
              customVideos.unshift(newVid);
              try { localStorage.setItem(STORAGE_KEY_CUSTOM, JSON.stringify(customVideos)); } catch(err) {}
              activeVideo = newVid;
              window.__closeModal();
              renderApp();
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
          }

          if (window.lucide) window.lucide.createIcons();
        };

        window.__closeModal = function() {
          const container = document.getElementById('modal-container');
          if (container) container.innerHTML = '';
        };

        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            if (!window.__REACT_MOUNTED__) {
              const root = document.getElementById('root');
              if (root && root.children.length === 0) {
                renderApp();
              }
            }
          }, 200);
        });
      })();
    </script>
  </body>
  </html>
